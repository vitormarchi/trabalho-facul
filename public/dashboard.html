<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Etherning</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .dashboard-header {
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .welcome-message h1 {
            font-size: 32px;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .welcome-message p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .user-info {
            background: var(--white);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .user-info h2 {
            font-size: 24px;
            color: var(--text-primary);
            margin-bottom: 20px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: var(--text-primary);
        }

        .info-value {
            color: var(--text-secondary);
        }

        .btn-logout {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="dashboard-header">
            <div class="welcome-message">
                <h1>Olá, <span id="user-name">Usuário</span>! 👋</h1>
                <p>Bem-vindo ao seu painel</p>
            </div>
            <button class="btn-logout" onclick="logout()">Sair</button>
        </div>

        <div class="user-info">
            <h2>Suas Informações</h2>
            <div class="info-item">
                <span class="info-label">Nome:</span>
                <span class="info-value" id="display-name">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Email:</span>
                <span class="info-value" id="display-email">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Membro desde:</span>
                <span class="info-value" id="display-created">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Último acesso:</span>
                <span class="info-value" id="display-last-login">-</span>
            </div>
        </div>
    </div>

    <script>
        // Verificar autenticação
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) {
            window.location.href = '/login.html';
        }

        // Formatar data
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Carregar dados do usuário
        if (user.name) {
            document.getElementById('user-name').textContent = user.name.split(' ')[0];
            document.getElementById('display-name').textContent = user.name;
            document.getElementById('display-email').textContent = user.email;  
            document.getElementById('display-username').textContent = user.username;
            document.getElementById('display-phone').textContent = user.phone;
            document.getElementById('display-address').textContent = user.address;
            document.getElementById('display-city').textContent = user.city;
            document.getElementById('display-state').textContent = user.state;
            document.getElementById('display-zip').textContent = user.zip;
            document.getElementById('display-country').textContent = user.country;
            
            if (user.createdAt) {
                document.getElementById('display-created').textContent = formatDate(user.createdAt);
            }
            
            if (user.lastLogin) {
                document.getElementById('display-last-login').textContent = formatDate(user.lastLogin);
            }
        }

        // Função de logout
        function logout() {
            if (confirm('Tem certeza que deseja sair?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = '/login.html';
            }
        }
    </script>
</body>
</html>
